# Compatibility fallback for a Hyprland process started with the legacy parser.
# New sessions use hyprland.lua automatically.

monitor = , 1920x1080@90, 0x0, 1
monitor = HDMI-A-1, preferred, auto, 1

$terminal = wezterm
$fileManager = nautilus
$menu = wofi --show drun

exec-once = waybar & env GSK_RENDERER=gl swaync & hyprpaper
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store & wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/battery-alert.sh

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

source = ~/.config/hypr/conf/general.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/window_rule.conf
