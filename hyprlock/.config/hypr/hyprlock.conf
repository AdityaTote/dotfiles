source = $HOME/.config/hypr/mocha.conf

$font = JetBrainsMono Nerd Font

general {
  hide_cursor = true
  ignore_empty_input = true
}

animations {
  enabled = true
}

bezier = smooth, 0.0, 0.0, 0.2, 1.0
animation = fadeIn, 1, 3, smooth
animation = fadeOut, 1, 2, smooth
animation = inputFieldDots, 1, 2, smooth

# ── Background ──────────────────────────────
background {
  monitor =
  path = ~/.config/backgrounds/local_arch_lock.png

  blur_passes = 0
  brightness = 0.75
  contrast = 1.0
  noise = 0.005
}

# ── Time — upper left ──────────────────────
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  font_family = $font
  font_size = 72
  color = rgba(166, 227, 161, 0.95)

  shadow_passes = 2
  shadow_size = 6
  shadow_color = rgba(0, 0, 0, 0.6)

  position = -500, -60
  halign = center
  valign = top
}

# ── Date — below time ──────────────────────
label {
  monitor =
  text = cmd[update:60000] echo "$(date +"%A, %d %B")"
  font_family = $font
  font_size = 16
  color = rgba(166, 227, 161, 0.70)

  shadow_passes = 1
  shadow_size = 3
  shadow_color = rgba(0, 0, 0, 0.5)

  position = -500, -210
  halign = center
  valign = top
}

# ── System status — upper right ─────────────
label {
  monitor =
  text = cmd[update:1000] sh $HOME/.config/hypr/scripts/lock-status.sh battery
  font_family = $font
  font_size = 14
  color = rgba(166, 227, 161, 0.85)

  position = -60, -70
  halign = right
  valign = top
}

label {
  monitor =
  text = cmd[update:5000] sh $HOME/.config/hypr/scripts/lock-status.sh network
  font_family = $font
  font_size = 14
  color = rgba(166, 227, 161, 0.85)

  position = -60, -105
  halign = right
  valign = top
}

label {
  monitor =
  text = cmd[update:5000] sh $HOME/.config/hypr/scripts/lock-status.sh notifications
  font_family = $font
  font_size = 14
  color = rgba(166, 227, 161, 0.85)

  position = -60, -140
  halign = right
  valign = top
}

label {
  monitor =
  text = cmd[update:60000] sh $HOME/.config/hypr/scripts/lock-status.sh system
  font_family = $font
  font_size = 14
  color = rgba(166, 227, 161, 0.85)

  position = -60, -175
  halign = right
  valign = top
}

# ── Media — lower right ─────────────────────
label {
  monitor =
  text = cmd[update:1000] sh $HOME/.config/hypr/scripts/lock-status.sh media
  font_family = $font
  font_size = 14
  color = rgba(166, 227, 161, 0.85)

  position = -60, 130
  halign = right
  valign = bottom
}

# ── Login panel — left side ─────────────────
shape {
  monitor =
  size = 380, 150
  color = rgba(0, 0, 0, 0.82)
  rounding = 24

  position = -480, 180
  halign = center
  valign = bottom
}

# ── Username — inside panel ──────────────────
label {
  monitor =
  text = $USER
  font_family = $font
  font_size = 16
  color = rgba(255, 255, 255, 0.90)

  position = -480, 265
  halign = center
  valign = bottom
}

# ── Input Field — inside panel ───────────────
input-field {
  monitor =
  size = 280, 44
  outline_thickness = 2

  dots_size = 0.22
  dots_spacing = 0.25
  dots_center = true
  dots_rounding = -1

  inner_color = rgba(166, 227, 161, 0.12)
  outer_color = rgba(166, 227, 161, 0.55)
  check_color = rgba(137, 211, 67, 0.70)
  capslock_color = rgba(250, 179, 135, 0.75)

  font_family = $font
  font_color = rgba(255, 255, 255, 0.85)

  rounding = 22
  fade_on_empty = false

  placeholder_text = <span alpha="70%"><i>Enter Password</i></span>

  fail_color = rgba(255, 99, 71, 0.90)
  fail_text = <span foreground="tomato"><i>Incorrect password ($ATTEMPTS attempts)</i></span>

  position = -480, 205
  halign = center
  valign = bottom
}
